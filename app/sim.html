<!doctype html><meta charset="utf-8"><title>Krishi Mitra - phone simulator</title>
<style>body{font-family:system-ui;max-width:640px;margin:2rem auto;padding:0 1rem}button{font-size:1.1rem;padding:.7rem 1.4rem;margin-right:.5rem}
#log div{padding:.4rem .6rem;margin:.3rem 0;border-radius:6px}.f{background:#e8f5e9}.b{background:#e3f2fd}.e{background:#ffebee}</style>
<h2>Krishi Mitra - phone simulator</h2>
<p>Test only. Sends your laptop mic as 8 kHz phone-quality audio to the same pipeline a real call would use. Use headphones to avoid echo.</p>
<button id="call">Call</button><button id="hang" disabled>Hang up</button> <span id="st"></span>
<div id="log"></div>
<script>
const log=(c,t)=>{const d=document.createElement('div');d.className=c;d.textContent=t;document.getElementById('log').prepend(d)};
let ws,ctx,proc,stream,nextT=0,carry=null;const R=8000;
document.getElementById('call').onclick=async()=>{
  const phone=new URLSearchParams(location.search).get('phone')||'';
  ws=new WebSocket((location.protocol==='https:'?'wss://':'ws://')+location.host+'/ws/call'+(phone?'?phone='+phone:''));
  ws.binaryType='arraybuffer';
  ctx=new AudioContext();await ctx.resume();nextT=0;
  stream=await navigator.mediaDevices.getUserMedia({audio:{echoCancellation:true,noiseSuppression:false,channelCount:1}});
  const src=ctx.createMediaStreamSource(stream);proc=ctx.createScriptProcessor(4096,1,1);
  let acc=[],pos=0;const ratio=ctx.sampleRate/R;
  proc.onaudioprocess=e=>{
    if(!ws||ws.readyState!==1)return;const x=e.inputBuffer.getChannelData(0);
    for(let i=0;i<x.length;i++){acc.push(x[i]);}
    const out=[];while(pos+ratio<=acc.length){let s=0,n=0;for(let k=Math.floor(pos);k<Math.floor(pos+ratio);k++){s+=acc[k];n++}
      out.push(Math.max(-1,Math.min(1,s/(n||1)))*32767);pos+=ratio}
    const drop=Math.floor(pos);acc=acc.slice(drop);pos-=drop;
    if(out.length)ws.send(Int16Array.from(out).buffer)};
  src.connect(proc);proc.connect(ctx.destination);
  ws.onmessage=ev=>{
    if(typeof ev.data!=='string'){
      let u=new Uint8Array(ev.data);
      if(carry){const t=new Uint8Array(u.length+1);t[0]=carry[0];t.set(u,1);u=t;carry=null}
      if(u.length&1){carry=[u[u.length-1]];u=u.slice(0,u.length-1)}
      const i16=new Int16Array(u.buffer,u.byteOffset,u.length>>1);
      const f=new Float32Array(i16.length);for(let i=0;i<i16.length;i++)f[i]=i16[i]/32768;
      const b=ctx.createBuffer(1,f.length,R);b.copyToChannel(f,0);const s=ctx.createBufferSource();s.buffer=b;s.connect(ctx.destination);
      nextT=Math.max(nextT,ctx.currentTime+0.05);s.start(nextT);nextT+=b.duration;return}
    const m=JSON.parse(ev.data);
    if(m.type==='transcript')log('f','Farmer: '+m.text+'  ('+m.stt_latency_ms+' ms STT)');
    else if(m.type==='reply')log('b','Bot: '+m.text+'  [first audio '+m.first_audio_ms+' ms after transcript]');
    else if(m.type==='error')log('e','ERROR '+m.where+': '+m.message)};
  ws.onclose=()=>{document.getElementById('st').textContent='call ended';document.getElementById('hang').click()};
  document.getElementById('hang').disabled=false;document.getElementById('st').textContent='in call';
};
document.getElementById('hang').onclick=()=>{try{ws&&ws.close()}catch(e){};try{stream&&stream.getTracks().forEach(t=>t.stop())}catch(e){};try{proc&&proc.disconnect()}catch(e){};document.getElementById('hang').disabled=true};
</script>
